; OPcache
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; PRODUÇÃO: validate_timestamps=0 desabilita revalidação de arquivos em disco (máxima performance).
; DESENVOLVIMENTO: mude para 1 para que alterações no código sejam aplicadas sem reiniciar o container.
opcache.validate_timestamps=0
opcache.fast_shutdown=1

; APCu
apc.enabled=1
apc.shm_size=32M

; Runtime
memory_limit=128M
max_execution_time=30
post_max_size=10M
upload_max_filesize=10M
