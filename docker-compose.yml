version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: courses_api
      DB_USER: api_user
      DB_PASS: api_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$fp=fsockopen(\"127.0.0.1\",9000,$$e,$$m,2);exit($$fp?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - courses-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - courses-network

  redis:
    image: redis:7-alpine
    networks:
      - courses-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: db
      DB_USER: api_user
      DB_PASSWORD: api_pass
      DB_NAME: courses_api
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    networks:
      - courses-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courses_api
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d courses_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - courses-network

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: courses_api_test
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: api_pass
    volumes:
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d courses_api_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - courses-network

networks:
  courses-network:
    driver: bridge

volumes:
  pgdata:
